<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RAG Simulator Dashboard</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
    }

    body {
        height: 100vh;
        display: flex;
        background: #0b0f19;
        color: white;
        overflow: hidden;
    }

    /* LEFT PANEL */
    .left {
        width: 22%;
        background: #111827;
        padding: 15px;
        border-right: 1px solid #222;
    }

    .step {
        padding: 10px;
        margin: 8px 0;
        background: #1f2937;
        border-radius: 10px;
        font-size: 13px;
        opacity: 0.6;
        transition: 0.3s;
    }

    .step.active {
        background: #2563eb;
        opacity: 1;
    }

    .chunk-box {
        margin-top: 15px;
        font-size: 12px;
        background: #0f172a;
        padding: 10px;
        border-radius: 10px;
        height: 40%;
        overflow: auto;
    }

    /* MIDDLE PANEL */
    .middle {
        width: 50%;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #222;
    }

    .chat-header {
        padding: 15px;
        border-bottom: 1px solid #222;
        font-weight: bold;
    }

    .chat-box {
        flex: 1;
        padding: 15px;
        overflow: hidden;
    }

    .msg {
        padding: 12px;
        margin: 10px 0;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.4;
    }

    .user {
        background: #1d4ed8;
        align-self: flex-end;
    }

    .bot {
        background: #1f2937;
    }

    .input-bar {
        display: flex;
        padding: 10px;
        border-top: 1px solid #222;
    }

    input {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: none;
        outline: none;
    }

    button {
        margin-left: 10px;
        padding: 10px 15px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
    }

    button:disabled {
        background: gray;
        cursor: not-allowed;
    }

    /* RIGHT PANEL */
    .right {
        width: 28%;
        padding: 15px;
        background: #111827;
    }

    textarea {
        width: 100%;
        height: 120px;
        margin-top: 10px;
        background: #0f172a;
        color: white;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 10px;
    }

    .controls {
        margin-top: 10px;
    }

    select, input[type="number"] {
        width: 100%;
        margin-top: 8px;
        padding: 8px;
        border-radius: 8px;
        border: none;
    }

    .kb-status {
        margin-top: 10px;
        padding: 10px;
        background: #1f2937;
        border-radius: 10px;
        font-size: 12px;
    }

</style>
</head>

<body>

<!-- LEFT PANEL -->
<div class="left">
    <h3>RAG Flow</h3>

    <div id="step1" class="step active">1. Input Received</div>
    <div id="step2" class="step">2. Chunking</div>
    <div id="step3" class="step">3. Embeddings</div>
    <div id="step4" class="step">4. Vector Store</div>
    <div id="step5" class="step">5. Retrieval</div>
    <div id="step6" class="step">6. LLM Generation</div>

    <div class="chunk-box" id="chunkBox">
        Chunks will appear here...
    </div>
</div>

<!-- MIDDLE PANEL -->
<div class="middle">
    <div class="chat-header">RAG Simulator Chat</div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-bar">
        <input id="userInput" placeholder="Ask something..." disabled />
        <button id="sendBtn" onclick="ask()" disabled>Send</button>
    </div>
</div>

<!-- RIGHT PANEL -->
<div class="right">
    <h3>Knowledge Builder</h3>

    <textarea id="docInput" placeholder="Paste your context here..."></textarea>

    <div class="controls">
        <label>Chunk Size</label>
        <input type="number" id="chunkSize" value="100" />

        <label>Overlap</label>
        <input type="number" id="overlap" value="20" />
    </div>

    <button onclick="buildKB()">Generate Vector Knowledge Base</button>

    <div class="kb-status" id="kbStatus">
        KB not created yet
    </div>
</div>

<script>
let KB = null;

function updateStep(step) {
    for (let i = 1; i <= 6; i++) {
        document.getElementById("step" + i).classList.remove("active");
    }
    document.getElementById("step" + step).classList.add("active");
}

function buildKB() {
    const text = document.getElementById("docInput").value;
    const size = parseInt(document.getElementById("chunkSize").value);
    const overlap = parseInt(document.getElementById("overlap").value);

    if (!text) return alert("Add context first!");

    updateStep(2);

    let chunks = [];
    for (let i = 0; i < text.length; i += (size - overlap)) {
        chunks.push(text.slice(i, i + size));
    }

    KB = chunks.map((c, i) => ({
        id: i,
        text: c,
        vector: Math.random()
    }));

    document.getElementById("chunkBox").innerHTML =
        KB.map(k => `<div>Chunk ${k.id}: ${k.text}</div>`).join("");

    updateStep(3);

    setTimeout(() => updateStep(4), 500);

    document.getElementById("kbStatus").innerText =
        `KB Created | Chunks: ${KB.length}`;

    document.getElementById("userInput").disabled = false;
    document.getElementById("sendBtn").disabled = false;
}

function ask() {
    const input = document.getElementById("userInput").value;
    if (!input) return;

    addMsg(input, "user");
    document.getElementById("userInput").value = "";

    updateStep(5);

    // fake retrieval
    let topChunks = KB.slice(0, 2);

    setTimeout(() => {
        updateStep(6);

        let response = generateResponse(input, topChunks);

        addMsg(response.text, "bot");

        addMsg(
            "🔎 Retrieved Chunks:\n" +
            topChunks.map(c => c.text).join("\n---\n"),
            "bot"
        );
    }, 800);
}

function generateResponse(query, chunks) {
    return {
        text: "Based on your context, here is a simulated RAG answer to: " + query
    };
}

function addMsg(text, type) {
    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    document.getElementById("chatBox").appendChild(div);
}
</script>

</body>
</html>
