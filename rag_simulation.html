<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RAG Simulator</title>

<style>
:root{
  --bg:#0b0f14;
  --panel:#111827;
  --card:#0f172a;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --blue:#3b82f6;
  --green:#22c55e;
  --orange:#f59e0b;
  --border:rgba(255,255,255,0.08);
}

*{
  box-sizing:border-box;
  font-family:system-ui;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
}

/* LAYOUT */
.wrapper{
  display:grid;
  grid-template-columns:280px 1fr 420px;
  height:100vh;
}

/* LEFT PIPELINE */
.left{
  padding:16px;
  border-right:1px solid var(--border);
}

.step{
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid var(--border);
  color:var(--muted);
  background:rgba(255,255,255,0.02);
}

.step.active{
  border-color:var(--blue);
  color:white;
}

/* CENTER CHAT */
.center{
  display:flex;
  flex-direction:column;
}

.header{
  padding:14px;
  border-bottom:1px solid var(--border);
  font-weight:600;
}

.chat{
  flex:1;
  padding:16px;
  overflow:auto;
}

.msg{
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  border:1px solid var(--border);
  white-space:pre-wrap;
}

.user{ background:rgba(59,130,246,0.12); }
.system{ background:rgba(255,255,255,0.03); }

.input{
  display:flex;
  gap:10px;
  padding:12px;
  border-top:1px solid var(--border);
}

textarea{
  flex:1;
  resize:none;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#0b1220;
  color:white;
}

/* BUTTONS */
button{
  border:none;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.btn-blue{ background:var(--blue); color:white; }
.btn-green{ background:var(--green); color:white; }
.btn-orange{ background:var(--orange); color:black; }

/* RIGHT PANEL */
.right{
  padding:16px;
  border-left:1px solid var(--border);
  overflow:auto;
}

.card{
  background:rgba(255,255,255,0.02);
  border:1px solid var(--border);
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
}

label{
  font-size:12px;
  color:var(--muted);
}

input{
  width:100%;
  padding:8px;
  margin:6px 0 10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#0b1220;
  color:white;
}

.chunk{
  padding:10px;
  border-left:3px solid var(--blue);
  margin-top:8px;
  background:rgba(255,255,255,0.02);
}

.final{
  border-left:3px solid var(--green);
}
</style>
</head>

<body>

<div class="wrapper">

  <!-- LEFT -->
  <div class="left">
    <div class="step active" id="s1">1. Ingestion</div>
    <div class="step" id="s2">2. Chunking + Embeddings</div>
    <div class="step" id="s3">3. Vector DB Creation</div>
    <div class="step" id="s4">4. Retrieval</div>
    <div class="step" id="s5">5. Prompt Augmentation</div>
    <div class="step" id="s6">6. LLM Response</div>
  </div>

  <!-- CENTER -->
  <div class="center">

    <div class="header">RAG Simulator (ChatGPT-style UX)</div>

    <div class="chat" id="chat">
      <div class="msg system">
        Upload context, configure chunking, and run a query to simulate a RAG system.
      </div>
    </div>

    <div class="input">
      <textarea id="query">How does semantic search work?</textarea>
      <button class="btn-blue" onclick="runQuery()">Run</button>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="right">

    <div class="card">
      <b>Step 1: Knowledge Input</b>

      <label>Context (Document)</label>
      <textarea id="context" style="width:100%;height:120px;background:#0b1220;color:white;border-radius:8px;border:1px solid var(--border);padding:8px;">
RAG improves LLMs by retrieving external knowledge.

Documents are chunked and embedded.

Vector DB enables semantic search.

Retrieved chunks are injected into prompts.
      </textarea>

      <label>Chunk Size</label>
      <input id="chunkSize" value="120"/>

      <label>Overlap</label>
      <input id="overlap" value="20"/>

      <button class="btn-green" onclick="buildDB()">
        Generate Vector Knowledge Base
      </button>
    </div>

    <div id="rightPanel"></div>

  </div>

</div>

<script>

let db = [];
let ready = false;

function setStep(n){
  for(let i=1;i<=6;i++){
    document.getElementById("s"+i).classList.remove("active");
  }
  document.getElementById("s"+n).classList.add("active");
}

function embed(t){
  return Array.from({length:6},(_,i)=>
    ((t.charCodeAt(i%t.length)||1)*(i+5))%97/97
  );
}

function chunk(text,size){
  let arr=[],i=0;
  while(i<text.length){
    arr.push(text.slice(i,i+size));
    i+=size;
  }
  return arr;
}

function buildDB(){

  setStep(2);

  let text=document.getElementById("context").value;
  let size=parseInt(document.getElementById("chunkSize").value);

  let chunks=chunk(text,size);

  db=chunks.map((c,i)=>({
    id:i+1,
    text:c,
    vec:embed(c)
  }));

  ready=true;

  setStep(3);

  addRight(`
    <div class="card">
      <b>Vector Knowledge Base Generated</b>
      <div style="color:var(--muted);font-size:12px;margin-top:6px;">
        Context converted into embeddings and stored in vector DB.
      </div>
      <div class="chunk">
        Total chunks: ${db.length}
      </div>
    </div>
  `);
}

function runQuery(){

  if(!ready){
    alert("Generate Vector DB first");
    return;
  }

  setStep(4);

  let q=document.getElementById("query").value;
  let qv=embed(q);

  addChat("user",q);

  let scored=db.map(d=>({
    ...d,
    score: similarity(qv,d.vec)
  })).sort((a,b)=>b.score-a.score).slice(0,2);

  setStep(5);

  let ctx=scored.map(s=>s.text).join("\n\n");

  setStep(6);

  addRight(`
    <div class="card">
      <b>Retrieved Context</b>
      ${scored.map(s=>`
        <div class="chunk">
          Chunk ${s.id} (score ${s.score})<br>
          ${s.text}
        </div>
      `).join("")}
    </div>
  `);

  addChat("system",
`Prompt Augmented:
User query + retrieved context combined before LLM call.
`);

  addChat("system",
`YOUR RESPONSE

Based on retrieved context, semantic search converts text into embeddings and compares vector similarity to retrieve relevant chunks. These chunks are injected into the prompt so the LLM generates grounded responses instead of hallucinations.
`);
}

function similarity(a,b){
  let s=0;
  for(let i=0;i<a.length;i++){
    s+=1-Math.abs(a[i]-b[i]);
  }
  return s.toFixed(2);
}

function addChat(type,text){
  let div=document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  document.getElementById("chat").appendChild(div);
}

function addRight(html){
  document.getElementById("rightPanel").innerHTML += html;
}

</script>

</body>
</html>
